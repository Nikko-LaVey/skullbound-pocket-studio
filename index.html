<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e18">
  <meta name="description" content="An offline-first personal project and idea hub for Skullbound Studios.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Skullbound">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <title>Skullbound Pocket Studio</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0c13;--card:#1b1824;--card2:#221e2d;--text:#f7f3fc;--muted:#a9a2b9;--border:#322d3d;--accent:#ed687f;--accent-dark:#4d2535;--bright:#ffc3cd;--positive:#79d0a0;--shadow:0 22px 50px rgba(0,0,0,.25)}
    body.light{color-scheme:light;--bg:#f5f1f6;--card:#fff;--card2:#f9f5fa;--text:#23192b;--muted:#6d6675;--border:#e7dce9;--accent:#ba395a;--accent-dark:#fbe6eb;--bright:#7c1740;--positive:#247c52;--shadow:0 18px 50px rgba(30,8,30,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{touch-action:manipulation}
    .app{max-width:680px;min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 21px) 19px calc(env(safe-area-inset-bottom) + 98px)}
    .eyebrow{color:var(--accent);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:10px}.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;border-radius:15px;background:linear-gradient(145deg,#ea7693,#7e294f);box-shadow:0 8px 24px #e64b7e30;color:white;font-size:23px;font-weight:900}.brand-name{font-size:14px;font-weight:900;letter-spacing:.065em}.brand-sub{font-size:11px;color:var(--muted)}.round{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);font-size:24px;line-height:1}
    h1{font-size:clamp(28px,7vw,40px);line-height:1.15;letter-spacing:-.045em;margin:8px 0 9px;font-weight:850}h2{font-size:20px;letter-spacing:-.025em;margin:0}p{margin:0;color:var(--muted)}.section-lead{margin:0 0 22px}.hero{position:relative;overflow:hidden;padding:25px 23px 24px;background:linear-gradient(115deg,#382035 2%,#52243a 53%,#2c1d37 100%);border:1px solid #69384d;border-radius:24px;box-shadow:var(--shadow);margin-bottom:26px;color:#fff}.hero:after{content:"✦";position:absolute;right:-11px;top:-53px;font-size:190px;opacity:.07;pointer-events:none}.hero p{color:#efd4dd}.hero h1{max-width:340px;margin-bottom:11px}.hero-actions{display:flex;gap:9px;margin-top:19px;flex-wrap:wrap}.primary,.secondary,.ghost,.danger{border-radius:13px;padding:11px 15px;font-weight:750;border:1px solid transparent}.primary{background:var(--accent);color:white}.secondary{background:#ffffff18;border-color:#ffffff30;color:#fff}.ghost{background:var(--card2);color:var(--text);border-color:var(--border)}.danger{color:#ff9cae;border:1px solid #773747;background:#3a2029}.small{font-size:13px;padding:8px 10px;border-radius:10px}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:19px 0 27px}.stat{background:var(--card);border:1px solid var(--border);padding:16px 13px;border-radius:18px}.stat strong{font-size:26px;letter-spacing:-.04em;display:block}.stat span{font-size:11px;color:var(--muted);font-weight:650}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 13px}.text-action{border:0;background:none;color:var(--accent);font-weight:800;padding:7px}.stack{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:16px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:18px;min-height:73px}.item:active{transform:scale(.995)}.item-icon{display:grid;place-items:center;border-radius:14px;width:44px;height:44px;flex:0 0 auto;background:var(--accent-dark);color:var(--bright);font-size:19px}.item-content{flex:1;min-width:0}.item-title{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-desc{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chevron{color:var(--muted);font-size:22px}.pill{display:inline-block;color:var(--muted);font-size:10px;font-weight:800;border:1px solid var(--border);background:var(--card2);padding:4px 8px;border-radius:30px;white-space:nowrap}.search{display:block;width:100%;margin-bottom:17px;padding:13px 15px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;font-size:15px}.empty{padding:36px 20px;text-align:center;border:1px dashed var(--border);border-radius:18px;background:var(--card)}.empty .symbol{display:block;font-size:31px;margin-bottom:9px}.empty strong{display:block;margin-bottom:3px}.empty p{font-size:13px}.empty button{margin-top:16px}.note-preview{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.quick{border:1px solid var(--border);border-radius:18px;background:var(--card);color:var(--text);text-align:left;padding:16px}.quick span{display:block;font-size:23px;margin-bottom:9px}.quick strong{display:block}.quick small{display:block;color:var(--muted);margin-top:3px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-weight:750;font-size:13px}.field input,.field textarea,.field select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px}.field textarea{resize:vertical;min-height:100px}.helper{font-size:12px;color:var(--muted);margin-top:6px}.setting{display:flex;justify-content:space-between;align-items:center;gap:13px;background:var(--card);border:1px solid var(--border);border-radius:17px;padding:16px;margin:10px 0}.setting p{font-size:12px}.notice{padding:14px;border:1px solid var(--border);background:var(--card);border-radius:15px;font-size:13px;color:var(--muted);margin:15px 0}.notice strong{color:var(--text)}.steps{padding-left:21px;color:var(--muted);line-height:1.8;font-size:13px}.step-card{padding:17px;background:var(--card);border:1px solid var(--border);border-radius:17px;margin:15px 0}
    .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 13px calc(env(safe-area-inset-bottom) + 8px);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--border);z-index:9}.tab{display:grid;place-items:center;gap:2px;border:0;background:transparent;color:var(--muted);padding:7px 3px;border-radius:13px;font-size:11px;font-weight:800}.tab .sym{font-size:22px;line-height:1.1}.tab[aria-current="page"]{color:var(--accent);background:var(--accent-dark)}
    .modal-overlay{position:fixed;inset:0;z-index:15;background:#000a;display:flex;align-items:flex-end;justify-content:center;padding:0}.modal{background:var(--card);border:1px solid var(--border);border-radius:25px 25px 0 0;width:min(680px,100%);max-height:min(90dvh,820px);overflow:auto;padding:21px 21px calc(24px + env(safe-area-inset-bottom));box-shadow:0 0 90px #0008}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{font-size:23px}.close{font-size:24px;background:none;color:var(--muted);border:0}.modal-actions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}.modal-actions .primary{flex:1}.task-add{display:flex;gap:8px;margin:17px 0}.task-add input{flex:1;min-width:0;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px}.task-row{display:flex;align-items:center;gap:9px;padding:11px 5px;border-bottom:1px solid var(--border)}.task-row input{width:19px;height:19px;accent-color:var(--accent)}.task-row span{flex:1;min-width:0;overflow-wrap:anywhere}.task-row.done span{text-decoration:line-through;color:var(--muted)}.icon-btn{border:0;background:transparent;color:var(--muted);font-size:18px;padding:6px}.muted{color:var(--muted)}.footer{margin:26px 0;text-align:center;color:var(--muted);font-size:11px}.hidden{display:none!important}
    @media(min-width:590px){.app{padding-left:30px;padding-right:30px}.hero{padding:29px}.modal{border-radius:25px;margin-bottom:24px}.modal-overlay{align-items:center}}@media(prefers-reduced-motion:no-preference){.item,.quick,.primary{transition:transform .13s ease,filter .13s}.primary:active,.quick:active{transform:scale(.98)}}
  </style>
</head>
<body>
  <div class="app">
    <header class="header"><div class="brand"><div class="mark" aria-hidden="true">S</div><div><div class="brand-name">SKULLBOUND</div><div class="brand-sub">POCKET STUDIO · BETA 0.1</div></div></div><button class="round" id="headerAdd" aria-label="Add a project or note">+</button></header>
    <main id="content" aria-live="polite"></main>
    <footer class="footer">SKULLBOUND STUDIOS · 2026 · LOCAL-FIRST</footer>
  </div>
  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab" data-tab="home"><span class="sym" aria-hidden="true">⌂</span>Home</button>
    <button class="tab" data-tab="projects"><span class="sym" aria-hidden="true">▤</span>Projects</button>
    <button class="tab" data-tab="notes"><span class="sym" aria-hidden="true">✎</span>Notes</button>
    <button class="tab" data-tab="settings"><span class="sym" aria-hidden="true">⚙</span>Settings</button>
  </nav>
  <div id="dialogRoot"></div>
  <input id="backupImport" type="file" accept="application/json,.json" class="hidden" aria-label="Import backup file">
  <script src="./app.js" defer></script>
</body>
</html>
